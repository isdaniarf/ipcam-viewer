name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: proxy/go.sum
      - name: Config readers agree
        run: node scripts/test-config-parity.mjs
      - name: Proxy vet and tests
        working-directory: proxy
        run: |
          go vet ./...
          go test -race ./...
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
