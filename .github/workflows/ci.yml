name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Config readers agree
        run: node scripts/test-config-parity.mjs
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
